schema_version: 1

# Variant of firewalla-gold-plus.yaml for a Firewalla with one flat LAN and
# no VLAN networks. The latest 2026-09-05 test uses bond0 over eth3+eth2;
# WAN now uses bond1 over eth0+eth1. The LAN LAG, access ports, and
# office trunk all carry a single native VLAN.

device:
  models:
    - QSW-L2110-10T
  firmware:
    - "2.2.3.20260713"
  port_count: 10

link_aggregation:
  system_priority: 32768
  managed_ports: [1, 2, 3, 4]
  groups:
    - id: 1
      mode: lacp
      members: [1, 2]
      port_priority: 128
      timeout: short
    - id: 2
      mode: lacp
      members: [3, 4]
      port_priority: 128
      timeout: short

safety:
  firewalla_double_lacp:
    wan_transit_vlan: 3999
    wan_lag: 1
    lan_lag: 2
    ont_port: 9
    office_port: 10
    rescue_port: 8
    rescue_vlan: 1

# Port plan:
#   1+2  Firewalla WAN LAG      VLAN 3999 untagged
#   3+4  Firewalla LAN LAG      VLAN 10 untagged
#   5-7  LAN access ports       VLAN 10 untagged
#   8    rescue                VLAN 1 untagged (QSS also reachable via LAN)
#   9    10G ONT                VLAN 3999 untagged
#   10   10G office switch      VLAN 10 untagged
vlans:
  - id: 1
    name: default
    untagged: [8]
    tagged: []
  - id: 10
    name: lan
    untagged: [3, 4, 5, 6, 7, 10]
    tagged: []
  - id: 3999
    name: wan-transit
    untagged: [1, 2, 9]
    tagged: []
