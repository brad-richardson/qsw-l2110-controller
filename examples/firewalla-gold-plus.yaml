schema_version: 1

device:
  models:
    - QSW-L2110-10T
  # Writes are guarded by an exact build string from /status.json.
  firmware:
    - "2.2.3.20260713"
  port_count: 10

link_aggregation:
  system_priority: 32768
  # Only these ports may be changed by the LAG reconciler. Unlisted ports are
  # preserved, while a managed port absent from a group is set to Disable.
  managed_ports: [1, 2, 3, 4]
  groups:
    - id: 1
      mode: lacp
      members: [1, 2]
      port_priority: 128
      timeout: short
    - id: 2
      mode: lacp
      members: [3, 4]
      port_priority: 128
      timeout: short

# This optional profile turns the topology's non-negotiable WAN/LAN separation
# into executable policy. It is checked against desired and discovered VLANs.
safety:
  firewalla_double_lacp:
    wan_transit_vlan: 3999
    wan_lag: 1
    lan_lag: 2
    ont_port: 9
    office_port: 10
    rescue_port: 8
    rescue_vlan: 1

# Port plan:
#   1+2  Firewalla WAN LAG
#   3+4  Firewalla LAN LAG
#   5    LAN-native access/test connection
#   6-7  unused/local access ports
#   8    dedicated VLAN 1 rescue connection until management behavior is proven
#   9    10G ONT
#   10   10G office-switch trunk
#
# VLAN state values are generated as 0=not-member, 1=untagged, 2=tagged.
# Include VLAN 1 because ports are deliberately being removed from its default
# untagged membership. Unlisted VLANs are preserved, never deleted.
vlans:
  - id: 1
    name: default
    untagged: [6, 7, 8]
    tagged: []
  - id: 10
    name: lan-native
    untagged: [3, 4, 5, 10]
    tagged: []
  - id: 20
    name: trusted
    untagged: []
    tagged: [3, 4, 10]
  - id: 30
    name: iot
    untagged: []
    tagged: [3, 4, 10]
  - id: 3999
    name: wan-transit
    untagged: [1, 2, 9]
    tagged: []
