schema_version: 1

# Intermediate state for either direction of the 1+2 <-> 1+8 experiment.
# Group 4 Long on 1+2; rescue VLAN 1 on ports 3 and 8.
# Forward: apply this first, then lan-lag-ports-1-8-long-20260906.yaml.
# Restore: apply this first, then lan-lag-ports-1-2-restore-from-1-8-20260906.yaml.
# Staging avoids a cyclic untagged VLAN swap; preserve management port 10.
# Coordinate physical cable placement with the final target.

device:
  models: [QSW-L2110-10T]
  firmware: ["2.2.3.20260713"]
  port_count: 10

link_aggregation:
  system_priority: 32768
  managed_ports: [1, 2, 3, 4, 8]
  groups:
    - id: 4
      mode: lacp
      members: [1, 2]
      port_priority: 128
      timeout: long

vlans:
  - id: 1
    name: default
    untagged: [3, 8]
    tagged: []
  - id: 10
    name: lan
    untagged: [1, 2, 4, 5, 6, 7, 10]
    tagged: []
  - id: 3999
    name: wan-transit
    untagged: [9]
    tagged: []
