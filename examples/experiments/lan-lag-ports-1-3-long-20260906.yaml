schema_version: 1

# Move from failed 1+8 to 1+3, group 4 Long. Firewalla stays unchanged.
# Preconditions: ports 2 and 3 empty; management on port 10.
# FIRST apply lan-lag-ports-1-8-rescue-stage-20260906.yaml:
# temporarily configure 1+2 and rescue VLAN 1 on 3+8 (port 1 carries LAN).
# THEN apply this target, returning rescue VLAN to 8 and port 3 to LAN VLAN 10.
# After verified save/readback, move only the QNAP cable end 8 -> 3.
# Restore to healthy 1+2 using lan-lag-ports-1-2-restore-from-1-3-20260906.yaml
# DIRECTLY (VLANs already match), coordinated with cable move 3 -> 2.

device:
  models: [QSW-L2110-10T]
  firmware: ["2.2.3.20260713"]
  port_count: 10

link_aggregation:
  system_priority: 32768
  managed_ports: [1, 2, 3, 4, 8]
  groups:
    - id: 4
      mode: lacp
      members: [1, 3]
      port_priority: 128
      timeout: long

vlans:
  - id: 1
    name: default
    untagged: [8]
    tagged: []
  - id: 10
    name: lan
    untagged: [1, 2, 3, 4, 5, 6, 7, 10]
    tagged: []
  - id: 3999
    name: wan-transit
    untagged: [9]
    tagged: []
