schema_version: 1

# Restore from 1+3 to known-working 1+2, retaining group 4 and Long timeout.
# VLANs already match: rescue VLAN 1 on 8; LAN VLAN 10 on 1-7 and 10.
# No intermediate VLAN stage is needed when restoring FROM the 1+3 target.
# Preconditions: port 2 empty; management remains on port 10.
# After verified apply, move only the QNAP cable end 3 -> 2.
# Firewalla settings and cable ends are unchanged.

device:
  models: [QSW-L2110-10T]
  firmware: ["2.2.3.20260713"]
  port_count: 10

link_aggregation:
  system_priority: 32768
  managed_ports: [1, 2, 3, 4, 8]
  groups:
    - id: 4
      mode: lacp
      members: [1, 2]
      port_priority: 128
      timeout: long

vlans:
  - id: 1
    name: default
    untagged: [8]
    tagged: []
  - id: 10
    name: lan
    untagged: [1, 2, 3, 4, 5, 6, 7, 10]
    tagged: []
  - id: 3999
    name: wan-transit
    untagged: [9]
    tagged: []
