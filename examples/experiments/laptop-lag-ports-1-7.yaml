schema_version: 1

# Spare-port laptop test, prepared but not applied on 2026-09-05.
# Preconditions: WAN direct to Firewalla; switch ports 1, 2, 7, and 9 empty.
# Only LAG ports 1, 2, and 7 are managed. Existing LAN LAG 4 on 3+4 is preserved.
# Port 7 temporarily joins the otherwise disconnected VLAN 3999.
# Procedure and restore: docs/lacp-review-20260905.md

device:
  models: [QSW-L2110-10T]
  firmware: ["2.2.3.20260713"]
  port_count: 10

link_aggregation:
  system_priority: 32768
  managed_ports: [1, 2, 7]
  groups:
    - id: 1
      mode: lacp
      members: [1, 7]
      port_priority: 128
      timeout: short

vlans:
  - id: 1
    name: default
    untagged: [8]
    tagged: []
  - id: 10
    name: lan
    untagged: [3, 4, 5, 6, 10]
    tagged: []
  - id: 3999
    name: wan-transit
    untagged: [1, 2, 7, 9]
    tagged: []
