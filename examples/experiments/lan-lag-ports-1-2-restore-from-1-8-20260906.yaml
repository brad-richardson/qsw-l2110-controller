schema_version: 1

# FIRST apply lan-lag-ports-1-8-rescue-stage-20260906.yaml in either direction.

# Restore the pre-1+8 baseline: LAG 4 Long on 1+2, rescue VLAN 1 on port 8.
# Manages port 8 explicitly so it can leave group 4.
# Coordinate with cable move QNAP 8 -> 2; Firewalla ends stay unchanged.
# Preconditions: rescue port 3 has no newly attached client; management on port 10.

device:
  models: [QSW-L2110-10T]
  firmware: ["2.2.3.20260713"]
  port_count: 10

link_aggregation:
  system_priority: 32768
  managed_ports: [1, 2, 3, 4, 8]
  groups:
    - id: 4
      mode: lacp
      members: [1, 2]
      port_priority: 128
      timeout: long

vlans:
  - id: 1
    name: default
    untagged: [8]
    tagged: []
  - id: 10
    name: lan
    untagged: [1, 2, 3, 4, 5, 6, 7, 10]
    tagged: []
  - id: 3999
    name: wan-transit
    untagged: [9]
    tagged: []
