[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "qsw-l2110-controller"
version = "0.1.0a0"
description = "Experimental declarative controller for QNAP QSW-L2110 switches"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Brad Richardson", email = "brad-richardson@users.noreply.github.com" },
]
keywords = ["qnap", "qsw", "switch", "lacp", "vlan", "network-automation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
]
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9",
]

[project.scripts]
qsw-l2110 = "qsw_l2110.cli:main"

[project.urls]
Homepage = "https://github.com/brad-richardson/qsw-l2110-controller"
Issues = "https://github.com/brad-richardson/qsw-l2110-controller/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qsw_l2110"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Runs on the stock macOS python3 (3.9); keep pyupgrade from introducing newer syntax.
"tools/lacp_peer_test.py" = ["UP"]
"tools/mirror_receiver_macos.py" = ["UP"]

[tool.ruff.format]
# The formatter targets py314 and would rewrite except tuples into 3.14-only syntax.
exclude = ["tools/lacp_peer_test.py"]
